master:
  push:
    - name: sync
      runner:
        cpus: 1
      imports: https://cnb.cool/ecustmc/key/-/blob/main/env.yml
      stages:
        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/ECUSTMC/yggdrasil-connect.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_ACCESS_TOKEN}
            force: true

  # MODIFICATION: CNB-GIT-UPDATE
  # 由插件 UpdateController 通过 OpenAPI 触发：合并上游更新到 master，冲突时创建 Issue；
  # 合并成功后回调插件服务器，触发本地 git pull
  api_trigger_upstream_sync:
    - name: merge upstream
      runner:
        cpus: 1
      imports: https://cnb.cool/ecustmc/key/-/blob/main/env.yml
      docker:
        image: alpine/git:latest
      stages:
        - name: merge upstream and push
          script: |
            set -e
            git config user.name "cnb-sync-bot"
            git config user.email "cnb-sync-bot@cnb.cool"

            git remote remove upstream 2>/dev/null || true
            git remote add upstream "${UPSTREAM_URL}"
            git fetch upstream "${UPSTREAM_REF}"

            if git merge FETCH_HEAD --no-edit; then
              echo "OK" > /workspace/merge-result
            else
              echo "MERGE_CONFLICT" > /workspace/merge-result
              git diff --name-only --diff-filter=U > /workspace/conflict-files.txt || true
              exit 1
            fi

            # 用 credential.helper 内联 CNB_TOKEN，避免令牌落盘
            git -c credential.helper='!f() { echo "username=cnb"; echo "password=${CNB_TOKEN}"; }; f' \
              push "https://${CNB_WEB_HOST}/${CNB_REPO_SLUG}.git" "HEAD:${CNB_BRANCH}"
      endStages:
        - name: notify plugin on success
          script: |
            if [ "$(cat /workspace/merge-result 2>/dev/null)" = "OK" ]; then
              # 回调插件服务器，触发本地 git pull；secret 从密钥仓库注入
              # busybox wget：日志只显示变量名字面量，不显示实际令牌值
              wget -q -O /dev/null \
                --header="X-CNB-Callback-Token: ${CNB_CALLBACK_SECRET}" \
                --post-data="" \
                "${CALLBACK_URL}"
            fi
      failStages:
        - name: create issue on conflict
          script: |
            if [ "$(cat /workspace/merge-result 2>/dev/null)" = "MERGE_CONFLICT" ]; then
              CONFLICT_FILES="$(tr '\n' ',' < /workspace/conflict-files.txt 2>/dev/null | sed 's/,$//')"
              BODY="自动同步上游更新时发生合并冲突，请手动处理。\n\n冲突文件: ${CONFLICT_FILES}\n\n上游: ${UPSTREAM_URL} (${UPSTREAM_REF})\n构建日志: ${CNB_BUILD_WEB_URL}"
              JSON="$(printf '{"title":"%s","body":"%s"}' "[auto-sync] 上游更新合并冲突" "$BODY")"
              # busybox wget：header 从变量读取（日志只显示变量名字面量）
              wget -q -O /dev/null \
                --header="Authorization: Bearer ${CNB_TOKEN}" \
                --header="Content-Type: application/json" \
                --post-data="${JSON}" \
                "${CNB_API_ENDPOINT}/${CNB_REPO_SLUG}/-/issues"
            fi