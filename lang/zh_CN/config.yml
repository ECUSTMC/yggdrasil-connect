plugin-description: 重构版 Yggdrasil API 插件，修复了大量 Bug，添加了 Yggdrasil Connect 支持。使用之前请阅读插件 README。| with Union API Support
read-readme-first: 使用前请务必阅读 <a href="/admin/plugins/readme/yggdrasil-connect">插件 README</a>，了解插件配置方法和注意事项！
title: Yggdrasil Connect 配置

url:
  label: 本站的 Yggdrasil API 地址：
  notice: 请确认以上 URL 能够正常访问后再进行 authlib-injector 的配置。

common:
  title: 常规配置
  ygg_uuid_algorithm:
    title: UUID 生成算法
    v3: 'Version 3: 与离线用户 UUID 一致'
    v4: 'Version 4: 随机生成（想要同时兼容离线登录的不要选）'
    hint: 选择 Version 3 以获得对原离线服务器的最佳兼容性。
  ygg_token_expire_1:
    title: 令牌暂时失效时间
  ygg_token_expire_2:
    title: 令牌完全失效时间
    description: 分别指定 Token「暂时失效」与「完全失效」的过期时间，单位为秒
  ygg_tokens_limit:
    title: 令牌数量限制
    description: 限制每个用户能拥有令牌的最大数量
  ygg_rate_limit:
    title: 登录/登出频率限制
    hint: 两次操作之间的时间间隔（毫秒）
  ygg_skin_domain:
    title: 额外皮肤白名单域名
    description: 只有在此列表中的材质才能被加载。「本站地址」和「当前访问地址」已经默认添加至白名单列表，需要添加的额外白名单域名请使用半角逗号 (,) 分隔
  ygg_search_profile_max:
    title: 批量查询角色数量限制
    hint: 一次请求中最多能查询几个角色
  ygg_show_config_section:
    title: 显示快速配置板块
    label: 在用户中心首页显示「快速配置启动器」板块
  ygg_enable_ali:
    title: API 地址指示
    label: 开启「API 地址指示 (ALI)」功能

keypair:
  title: 密钥对配置
  ygg_private_key:
    title: OpenSSL 私钥
    hint: 只需填写 PEM 格式的私钥即可，公钥会根据私钥自动生成。
    generate: 生成私钥
    submit: 保存私钥
    message: 使用下方的按钮来自动生成符合格式的私钥。
    valid: 私钥有效。
    invalid: 无效的私钥，请检查后重新配置。

rsa:
  invalid: 无效的 RSA 私钥，请访问插件配置页重新设置
  length: RSA 私钥的长度至少为 4096，请访问插件配置页重新设置

restore:
  title: Restore API
  enable:
    title: 启用Restore API
    label: 启用Restore API（配合修改版MultiLogin插件使用）
  
union:
  title: Union相关配置
  keypair:
    label: 用户信息签名密钥，由Union主服务器生成。
  api_root:
    title: Union API Root
  member_key:
    title: Union Member Key
    hint: 成员服务器认证令牌，请妥善保管
  data:
    title: Union数据
    outdated: 数据已过时
    uptodate: 数据已同步
    trigger_update: 更新服务器列表
    trigger_update_key: 更新密钥对
    trigger_sync: 同步角色数据
    trigger_diagnose: 自助诊断
  backend:
    title: 皮肤站列表
    code: 皮肤站缩写
    name: 皮肤站名称
    bs_root: 皮肤站链接
  admin_notice: 通知
  enable_update:
    title: 允许插件自动更新
  local_blacklist:
    title: 本地启用黑名单
    hint: 该选项启用时：1) 使用本地API（而不是Union API）的服务器也启用黑名单；2) 通过此站点登录的封禁用户，加入服务器时会显示“已封禁”而不是“身份验证服务器宕机”。
  oauth2:
    title: Union OAuth2
    sig_private_key:
      title: 签名私钥
      hint: 对发送给Union服务器的用户信息签名
    sig_public_key:
      title: 验签公钥
      hint: Union服务器使用此公钥验证用户信息，确认来自这个站点
    sig_key:
      valid: 密钥有效
      invalid: 密钥无效，此站点无法授权Union OAuth2

cnb:
  title: CNB 流水线更新
  enable:
    title: 启用基于 CNB 流水线的更新
    hint: 开启后，联盟下发「更新插件」请求时将不再直接下载 zip 覆盖，而是触发 CNB 流水线合并上游更新。
    label: 用 CNB 流水线合并上游更新（避免覆盖本地改动）
  repo:
    title: CNB 仓库
    hint: 本地插件 git clone 的来源仓库，格式为「组织/仓库」，例如 ecustmc/yggdrasil-connect
  branch:
    title: 更新分支
    hint: 本地插件与 CNB 仓库使用的分支，例如 master
  upstream:
    title: 上游仓库 URL
    hint: 要合并的上游 git 地址，例如您 fork 的原仓库
  upstream_ref:
    title: 上游分支
    hint: 上游要合并的分支，例如 main
  token:
    title: CNB 访问令牌
    hint: 用于触发 CNB 流水线并查询构建状态的 OpenAPI 令牌，请使用最小权限令牌并妥善保管
  php_path:
    title: PHP CLI 路径
    hint: 启动后台更新进程用的 php 命令路径，留空默认为 php；若后台进程启动失败，可填绝对路径如 /usr/bin/php
  callback_secret:
    title: CNB 回调令牌
    hint: 流水线回调本站用的令牌，需与 CNB 密钥仓库中的 CNB_CALLBACK_SECRET 一致，请妥善保管

yggc:
  disable_authserver:
    title: 禁用 Auth Server
    hint: 即 /authserver 下的 API
    label: 禁用 Yggdrasil API 的 Auth Server
    description: |
      禁用后，用户将无法通过在启动器中输入用户名和密码的传统方式登录，必须通过 Yggdrasil Connect 登录。<br>
      如不禁用，请确保你创建了个人访问客户端，并在 <code>.env</code> 文件中设置了 <code>PASSPORT_PERSONAL_ACCESS_CLIENT_ID</code>，否则插件无法正常工作。
    empty-client-id: 你启用了 Auth Server，但没有设置 <code>PASSPORT_PERSONAL_ACCESS_CLIENT_ID</code>。请在 <code>.env</code> 文件中设置该值。要了解如何配置该设置项，请阅读 <a href="/admin/plugins/readme/yggdrasil-connect">插件 README</a>。
    invalid-client-id: <code>PASSPORT_PERSONAL_ACCESS_CLIENT_ID</code> 对应的应用不是个人访问客户端，请创建个人访问客户端，并将 <code>PASSPORT_PERSONAL_ACCESS_CLIENT_ID</code> 的值设为该客户端的 ID。
  device_code_expires_in:
    title: 设备码过期时间
    description: 设备授权流程中设备码的有效时间，单位为秒。
  grant_expires_in:
    title: 授权过期时间
    description: 用户授权的有效时间，过期后需要重新授权，单位为秒。
  shared_client_id:
    title: 共享客户端 ID
    description: 用于设备授权流程的共享 OAuth 客户端 ID。启动器会从 OIDC Discovery 文档中读取此 ID 并自动使用。
    hint: 留空时将自动使用 PASSPORT_PERSONAL_ACCESS_CLIENT_ID 环境变量的值。
  enable_campus_status:
    title: 启用在校状态查询
    label: 启用 campus_status 权限范围
    description: 启用后，客户端可请求 <code>campus_status</code> 权限范围，在用户信息和 ID 令牌中获取用户的在校状态。需配合 <a href="https://cnb.cool/ecustmc/campus-status" target="_blank">campus-status 插件</a> 使用。
